<title>📊 희과담 인원 확인 — 2026-2</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 26px 18px 60px; }
  .back-link { font-size: 13px; }
  .search-box input {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px; font-family: inherit;
  }
  .area-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .area-tab {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; font-family: inherit;
  }
  .area-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sub-area-wrap { margin: 10px 0 16px; }
  .sub-area-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .sub-area-tab {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-family: inherit;
  }
  .sub-area-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sub-area-note { font-size: 11.5px; color: var(--text-dim); margin: 6px 0 0; }
  .wc-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .wc-count { font-size: 12.5px; color: var(--text-dim); }
  .filter-check { font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
  table.wc-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  table.wc-table th { background: var(--panel-2); border: 1px solid var(--border); padding: 6px; color: var(--text); font-weight: 700; }
  table.wc-table td { border: 1px solid var(--border); padding: 6px; text-align: center; color: var(--text); }
  table.wc-table td.wc-name { text-align: left; white-space: normal; min-width: 140px; }
  table.wc-table th.grp-hope { background: rgba(31,138,86,0.14); }
  table.wc-table th.grp-assign { background: rgba(60,120,220,0.14); }
  table.wc-table tr:hover td { background: var(--panel-2); }
  table.wc-table td.wc-sum { font-weight: 700; }
  .wc-ratio { font-weight: 800; font-variant-numeric: tabular-nums; }
  .wc-ratio.safe { color: #1f8a56; }
  .wc-ratio.warn { color: #c88a1c; }
  .wc-ratio.danger { color: #c0392b; }
  .wc-ratio.none { color: var(--text-dim); font-weight: 400; }
  .rec-panel { margin-top: 20px; }
  .rec-toggle-btn { width: 100%; }
  .rec-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .rec-item {
    display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  .rec-num {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .rec-body { flex: 1 1 auto; font-size: 13px; }
  .rec-body b { display: block; }
  .rec-body span { font-size: 11.5px; color: var(--text-dim); }
  .empty-note { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 0; }
  .truncate-note { text-align: center; color: var(--text-dim); font-size: 12px; padding: 10px 0; }
</style>

<div class="topbar">
  <h1>📊 희과담 인원 확인 <span class="sub">2026학년도 2학기</span></h1>
  <a class="btn back-link" href="index.html">← 시간표로 돌아가기</a>
</div>

<div class="wrap">
  <div class="search-box">
    <input id="wcSearch" type="text" placeholder="과목명으로 검색 (예: 대학영어, 경제학원론, 미적분학...)">
  </div>
  <div class="area-tabs" id="wcAreaTabs"></div>
  <div class="sub-area-wrap" id="wcSubAreaWrap" style="display:none;">
    <div class="sub-area-tabs" id="wcSubAreaTabs"></div>
    <div class="sub-area-note" id="wcSubAreaNote">💡 세부영역은 일반사회교육과 학생이 신청 가능한 분반(타 캠퍼스·유학생 전용·본과 개설 분반 제외) 기준으로 분류했습니다. 전체 개설 분반은 위 "전체" 상태에서 검색하세요.</div>
  </div>

  <div class="wc-toolbar">
    <span class="wc-count" id="wcCount"></span>
    <span style="display:flex; gap:14px; flex-wrap:wrap;">
      <label class="filter-check"><input type="checkbox" id="wcOurOnly"> 일반사회교육과 관련 과목만</label>
      <label class="filter-check"><input type="checkbox" id="wcSelectedOnly"> 선택한 과목만 보기</label>
    </span>
  </div>

  <div class="table-scroll">
    <table class="wc-table">
      <thead>
        <tr>
          <th rowspan="2"></th>
          <th rowspan="2">과목명</th>
          <th rowspan="2">분반</th>
          <th rowspan="2">구분</th>
          <th rowspan="2">학점</th>
          <th rowspan="2">교수</th>
          <th rowspan="2">시간</th>
          <th rowspan="2">장소</th>
          <th colspan="5" class="grp-hope">희망인원</th>
          <th colspan="5" class="grp-assign">배정인원</th>
          <th rowspan="2">경쟁률</th>
        </tr>
        <tr>
          <th class="grp-hope">주전공</th><th class="grp-hope">부전공</th><th class="grp-hope">일반선택</th><th class="grp-hope">타대생</th><th class="grp-hope">합계</th>
          <th class="grp-assign">주전공</th><th class="grp-assign">부전공</th><th class="grp-assign">일반선택</th><th class="grp-assign">타대생</th><th class="grp-assign">합계</th>
        </tr>
      </thead>
      <tbody id="wcBody"></tbody>
    </table>
  </div>

  <div class="rec-panel">
    <button class="btn primary rec-toggle-btn" id="wcRecBtn">🎯 선택한 과목 신청 순서 추천 보기</button>
    <div id="wcRecOutput"></div>
  </div>
</div>

<script src="js/data-wishcount.js"></script>
<script>
  const RENDER_CAP = 300;
  const CATEGORY_ORDER = ["all", "효원핵심교양", "효원균형교양", "효원창의교양", "교직과목", "일반선택", "전공기초", "전공필수", "전공선택"];
  const SUB_AREAS = {
    "효원균형교양": [
      { key: "sasang", label: "사상과 역사" }, { key: "sahoe", label: "사회와 문화" }, { key: "segye", label: "세계와 소통" },
      { key: "munhak", label: "문학과 예술" }, { key: "gwahak", label: "과학과 기술" }
    ],
    "효원창의교양": [
      { key: "yunghap", label: "융합과 창의" }, { key: "geongang", label: "건강과 레포츠" }, { key: "inseong", label: "인성과 사회봉사" }
    ]
  };
  let wcCategory = "all";
  let wcSubArea = "all";
  let wcSubField = null;
  let wcKeyword = "";
  let wcOurOnlyFlag = false;
  let wcSelectedOnlyFlag = false;
  let wcSelected = new Set();

  function ratioClass(r) {
    if (r == null) return "danger"; // 배정인원 0인데 희망만 있는 경우 = 가장 위험
    if (r === 0) return "none";
    if (r < 0.8) return "safe";
    if (r < 1.5) return "warn";
    return "danger";
  }
  function ratioLabel(r) {
    if (r == null) return "배정 0명";
    if (r === 0) return "희망 0명";
    return `${r.toFixed(2)}배`;
  }

  function renderAreaTabs() {
    const present = new Set(WISH_DATA.map(d => d.category));
    const cats = CATEGORY_ORDER.filter(c => c === "all" || present.has(c));
    const el = document.getElementById("wcAreaTabs");
    el.innerHTML = cats.map(c => {
      const label = c === "all" ? "전체" : c;
      return `<button class="area-tab${c === wcCategory ? " active" : ""}" data-cat="${c}">${label}</button>`;
    }).join("");
    el.querySelectorAll(".area-tab").forEach(btn => {
      btn.onclick = () => {
        wcCategory = btn.dataset.cat;
        wcSubArea = "all";
        renderAreaTabs(); renderSubAreaTabs(); renderWcTable();
      };
    });
  }

  function subTabsConfigFor(category) {
    if (SUB_AREAS[category]) return { field: "area", options: SUB_AREAS[category] };
    if (category === "효원핵심교양") {
      const counts = new Map();
      WISH_DATA.forEach(d => { if (d.category === category) counts.set(d.name, (counts.get(d.name) || 0) + 1); });
      const options = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => ({ key: name, label: name }));
      return { field: "name", options };
    }
    return null;
  }

  function renderSubAreaTabs() {
    const wrap = document.getElementById("wcSubAreaWrap");
    const el = document.getElementById("wcSubAreaTabs");
    const note = document.getElementById("wcSubAreaNote");
    const config = subTabsConfigFor(wcCategory);
    if (!config) { wrap.style.display = "none"; el.innerHTML = ""; wcSubField = null; return; }
    wrap.style.display = "";
    wcSubField = config.field;
    note.style.display = config.field === "area" ? "" : "none";
    const tabs = [{ key: "all", label: "전체" }, ...config.options];
    el.innerHTML = tabs.map(t => `<button class="sub-area-tab${t.key === wcSubArea ? " active" : ""}" data-sub="${t.key}">${t.label}</button>`).join("");
    el.querySelectorAll(".sub-area-tab").forEach(btn => {
      btn.onclick = () => { wcSubArea = btn.dataset.sub; renderSubAreaTabs(); renderWcTable(); };
    });
  }

  function filteredData() {
    let items = WISH_DATA;
    if (wcCategory !== "all") items = items.filter(d => d.category === wcCategory);
    if (wcSubArea !== "all" && wcSubField) items = items.filter(d => d[wcSubField] === wcSubArea);
    if (wcOurOnlyFlag) items = items.filter(d => d.area !== null);
    const kw = wcKeyword.trim().toLowerCase();
    if (kw) items = items.filter(d => d.name.toLowerCase().includes(kw));
    if (wcSelectedOnlyFlag) items = items.filter(d => wcSelected.has(`${d.code}-${d.section}`));
    return items;
  }

  function renderWcTable() {
    const items = filteredData();
    document.getElementById("wcCount").textContent = `${items.length}개 분반 중 ${Math.min(items.length, RENDER_CAP)}개 표시 · 선택 ${wcSelected.size}개`;
    const body = document.getElementById("wcBody");
    if (!items.length) { body.innerHTML = `<tr class="empty-row"><td colspan="19" class="empty-note">검색 결과가 없습니다.</td></tr>`; return; }
    const shown = items.slice(0, RENDER_CAP);
    let html = shown.map(d => {
      const id = `${d.code}-${d.section}`;
      const checked = wcSelected.has(id) ? "checked" : "";
      return `<tr>
        <td><input type="checkbox" data-wc-pick="${id}" ${checked}></td>
        <td class="wc-name">${d.name}</td>
        <td>${d.section}</td>
        <td>${d.category}</td>
        <td>${d.credit || "-"}</td>
        <td>${d.professor || "-"}</td>
        <td>${d.schedule || "-"}</td>
        <td>${d.location || "-"}</td>
        <td>${d.hopeMain}</td>
        <td>${d.hopeSub}</td>
        <td>${d.hopeGeneral}</td>
        <td>${d.hopeOther}</td>
        <td class="wc-sum">${d.hopeTotal}</td>
        <td>${d.assignMain}</td>
        <td>${d.assignSub}</td>
        <td>${d.assignGeneral}</td>
        <td>${d.assignOther}</td>
        <td class="wc-sum">${d.assignedTotal}</td>
        <td><span class="wc-ratio ${ratioClass(d.ratio)}">${ratioLabel(d.ratio)}</span></td>
      </tr>`;
    }).join("");
    if (items.length > RENDER_CAP) {
      html += `<tr><td colspan="19" class="truncate-note">검색 결과가 많아 ${RENDER_CAP}개만 표시했습니다. 검색어를 더 구체적으로 입력해 보세요.</td></tr>`;
    }
    body.innerHTML = html;
    body.querySelectorAll("[data-wc-pick]").forEach(cb => {
      cb.onchange = () => {
        const id = cb.dataset.wcPick;
        if (cb.checked) wcSelected.add(id); else wcSelected.delete(id);
        document.getElementById("wcCount").textContent = `${filteredData().length}개 분반 중 ${Math.min(filteredData().length, RENDER_CAP)}개 표시 · 선택 ${wcSelected.size}개`;
      };
    });
  }

  function renderRecommendation() {
    const out = document.getElementById("wcRecOutput");
    const picked = WISH_DATA.filter(d => wcSelected.has(`${d.code}-${d.section}`));
    if (!picked.length) {
      out.innerHTML = `<p class="empty-note">추천을 보려면 위 표에서 신청할 과목을 먼저 선택하세요(체크박스).</p>`;
      return;
    }
    const sorted = [...picked].sort((a, b) => {
      const ra = a.ratio == null ? 999 : a.ratio, rb = b.ratio == null ? 999 : b.ratio;
      return rb - ra;
    });
    out.innerHTML = `
      <p class="panel-note" style="margin:10px 0 0;">💡 경쟁률이 높은(정원 대비 희망인원이 많은) 과목일수록 수강신청 시작 직후 정원이 먼저 마감될 가능성이 큽니다.
      아래 순서대로, <b>경쟁이 치열한 과목부터 먼저</b> 신청하고 여유 있는 과목은 뒤로 미루는 것을 추천합니다.</p>
      <ul class="rec-list">
        ${sorted.map((d, i) => `
          <li class="rec-item">
            <span class="rec-num">${i + 1}</span>
            <span class="rec-body">
              <b>${d.name} ${d.section}분반</b>
              <span>희망 ${d.hopeTotal}명 / 배정 ${d.assignedTotal}명 · 경쟁률 <span class="wc-ratio ${ratioClass(d.ratio)}">${ratioLabel(d.ratio)}</span></span>
            </span>
          </li>`).join("")}
      </ul>`;
  }

  document.getElementById("wcSearch").addEventListener("input", (e) => { wcKeyword = e.target.value; renderWcTable(); });
  document.getElementById("wcOurOnly").addEventListener("change", (e) => { wcOurOnlyFlag = e.target.checked; renderWcTable(); });
  document.getElementById("wcSelectedOnly").addEventListener("change", (e) => { wcSelectedOnlyFlag = e.target.checked; renderWcTable(); });
  document.getElementById("wcRecBtn").onclick = renderRecommendation;

  renderAreaTabs();
  renderSubAreaTabs();
  renderWcTable();
</script>
